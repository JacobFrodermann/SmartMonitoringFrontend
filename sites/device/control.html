<!DOCTYPE html>
<html>
    <head>
        <title>Control</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../../css/global.css" />
        <link rel="stylesheet" href="/SWAC/swac/libs/uikit/css/uikit.min.css" />
        <script src="/SWAC/swac/libs/uikit/js/uikit.min.js"></script>
        <script src="/SWAC/swac/libs/uikit/js/uikit-icons.min.js"></script>
        <script src="/SWAC/swac/swac.js" type="module"></script>
        <script src="../../js/device/control.js"></script>
        <link rel="stylesheet" href="../../customisations/global.css" />
        <style>
            html, body { margin: 0; padding: 0; }
        </style>
    </head>
    <body>
        <!-- ── Modal 1: New route? ──────────────────────────────────────────── -->
        <div id="modal-new-route" uk-modal>
            <div class="uk-modal-dialog uk-modal-body">
                <h2 class="uk-modal-title" swac_lang="route_new_title">New route</h2>
                <p swac_lang="route_new_question">Do you want to start a new route?</p>
                <div class="uk-text-right uk-margin-small-top">
                    <button id="btn-route-no" class="uk-button uk-button-default"
                            swac_lang="route_no">No</button>
                    <button id="btn-route-yes" class="uk-button uk-button-primary uk-margin-small-left"
                            swac_lang="route_yes">Yes</button>
                </div>
            </div>
        </div>

        <!-- ── Modal 2: Name the route? ─────────────────────────────────────── -->
        <div id="modal-route-name" uk-modal>
            <div class="uk-modal-dialog uk-modal-body">
                <h2 class="uk-modal-title" swac_lang="route_name_title">Name your route</h2>
                <p swac_lang="route_name_question">Do you want to give this route a name?</p>
                <input id="input-route-name" class="uk-input uk-margin-small-top"
                       type="text" placeholder="Route name (optional)"
                       maxlength="30" />
                <p class="uk-text-muted uk-margin-remove-top" style="font-size: 0.8rem;">
                    <span swac_lang="route_name_hint">Max. 30 characters</span>
                    — <span id="input-route-name-counter">0</span> / 30
                </p>
                <div class="uk-text-right uk-margin-small-top">
                    <button id="btn-name-skip" class="uk-button uk-button-default"
                            swac_lang="route_name_skip">No</button>
                    <button id="btn-name-ok" class="uk-button uk-button-primary uk-margin-small-left"
                            swac_lang="route_name_ok">OK</button>
                </div>
            </div>
        </div>

        <div class="uk-text-center uk-margin-small-top">
            <div class="uk-button-group">
                <!--
                    data-cmd-toggle instead of data-cmd so wireButtons() in control.js
                    skips this button. The toggle modal logic in control.js handles it.
                -->
                <button class="device_toogle_measurement uk-button uk-button-primary"
                        data-cmd-toggle="smartMobile_toggle_measuring"
                        swac_lang="device_control_start">Start measurement</button>
                <div class="uk-inline">
                    <button class="uk-button uk-button-default" type="button" aria-label="Toggle Dropdown">
                        <span uk-icon="icon: triangle-down"></span>
                    </button>
                    <div uk-dropdown="mode: click; target: !.uk-button-group;">
                        <ul class="uk-nav uk-dropdown-nav">
                            <li class="uk-nav-header" swac_lang="device_power">Device</li>
                            <li><a href="#" data-cmd="shutdown" swac_lang="device_power_off">Power off</a></li>
                            <li><a href="#" data-cmd="reboot"   swac_lang="device_power_reboot">Reboot</a></li>
                            <li class="uk-nav-header" swac_lang="device_network">Data</li>
                            <li><a href="#" data-cmd="addWlan"  swac_lang="device_network_add_wlan">Add WLAN</a></li>
                            <li class="uk-nav-header" swac_lang="device_data">Data</li>
                            <li><a href="#" data-cmd="last_measuring" swac_lang="device_last_measuring">Last measurement</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <!-- Status message shown before first measurement -->
        <div class="messagebox uk-alert-primary" uk-alert>
            <a href class="uk-alert-close" uk-close></a>
            <p class="control_message_to_user" swac_lang="device_control_please_connect_device">Please connect your device</p>
        </div>
        <!-- Countdown display - values mirrored from index.html via postMessage -->
        <div id="sm-countdown" class="uk-text-center uk-text-muted uk-margin-small-top" style="display:none;">
            <span swac_lang="refreshin">Refresh in: </span><span id="sm-countdown-cur">-</span> / <span id="sm-countdown-max">-</span>
        </div>
        <!-- Live data display, hidden until measurement starts -->
        <div class="displayArea swac_dontdisplay">
            <div id="datadisplay_1"
                 swa="Dashboard FROM ../../customisations/device/index_datadisplay.json TEMPLATE centered"></div>
            <div class="uk-text-center" uk-grid>
                <div class="uk-width-1-5"></div>
                <div id="label_question_1" class="uk-width-expand@s"
                     swa="Question FROM ../../customisations/device/index_labelquestion.json OPTIONS label_question_options"></div>
                <div class="uk-width-1-5"></div>
            </div>
        </div>

        <script>
            document.getElementById('input-route-name').addEventListener('input', function () {
                document.getElementById('input-route-name-counter').textContent = this.value.length;
            });
        </script>
    </body>
</html>
