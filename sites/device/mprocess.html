<!DOCTYPE html>
<html>
    <head>
        <title swac_lang="object_dashboard_title">SmartMonitoring - Device process details</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" sizes="32x32" href="../../files/icons/32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="../../files/icons/16x16.png">
        <link rel="shortcut icon" type="image/x-icon" href="../../customisations/favicon.png">
        <link rel="stylesheet" href="../../css/global.css" />
        <link rel="stylesheet" href="/SWAC/swac/libs/uikit/css/uikit.min.css" />
        <script src="/SWAC/swac/libs/uikit/js/uikit.min.js"></script>
        <script src="/SWAC/swac/libs/uikit/js/uikit-icons.min.js"></script>
        <script src="/SWAC/swac/swac.js" type="module"></script>
        <script src="../../js/device/mprocess.js"></script>
        <link rel="stylesheet" href="../../customisations/global.css" />
    </head>
    <body>
        <h3>{{measurement_process}}</h3>

        <div id="map" class="swac_dontdisplay" swa="Worldmap2d FROM cmd://SmartData/smartdata/records/sensordata WHERE filter=measurement_process,eq,{{measurement_process}}"></div>

        <div id="chart" swa="Charts FROM cmd://SmartData/smartdata/records/sensordata WHERE filter=measurement_process,eq,{{measurement_process}}"></div>

        <div id="mprocess_statsdashboard" swa="Dashboard FROM ../../customisations/device/mprocess_statsdashboard.json TEMPLATE centered"></div>
        <div id="measurements_list" swa="Present FROM cmd://SmartData/smartdata/records/sensordata WHERE filter=measurement_process,eq,{{measurement_process}} AND includes=ts,pm2_5,pm10_0,temp1 AND size=100 AND order=ts,DESC TEMPLATE table_for_all_datasets"></div>
    </body>
</html>
